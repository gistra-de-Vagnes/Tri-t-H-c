databases:
  - name: philosophy_db
    databaseName: philosophy_db
    user: philosophy_user
    plan: free

services:
  - type: web
    name: philosophy-forum
    env: python
    runtime: python3
    buildCommand: "./build.sh"
    startCommand: "gunicorn philosophy.wsgi --log-file -"
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: philosophy_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
